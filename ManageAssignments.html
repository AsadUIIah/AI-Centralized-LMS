<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background: #eef2f7;
          font-family: 'Arial', sans-serif;
        }
        .navbar {
          background-color: #ff5c93;
        }
        .navbar-brand, .nav-link {
          color: #fff !important;
        }
        .logout-btn {
            background: #fff;
            color: #ff5c93;
            border: 1px solid #ff5c93;
            border-radius: 30px;
            padding: 5px 15px;
        }
        .logout-btn:hover {
            background: #ff5c93;
            color: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="TeacherDashboard.html">Teacher Dashboard</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
              <li class="nav-item">
                <button class="logout-btn">Logout</button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    <div class="container mt-5">
        <h2 class="mb-4">Manage Assignments</h2>
        <a href="#" class="btn btn-success mb-3">Add New Assignment</a>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Assignment Title</th>
                    <th>Course</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Replace with dynamic data -->
                <tr>
                    <td>1</td>
                    <td>Assignment 1: Loops and Conditions</td>
                    <td>CS101</td>
                    <td>2024-12-25</td>
                    <td>
                        <a href="#" class="btn btn-primary btn-sm">Edit</a>
                        <a href="#" class="btn btn-danger btn-sm">Delete</a>
                        <a href="#" class="btn btn-info btn-sm">View Submissions</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
