<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #eef2f7;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background-color: #ff5c93;
    }
    .navbar-brand, .nav-link {
      color: #fff !important;
    }
    .card {
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #ff5c93, #ffc371);
      color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card-body {
      text-align: center;
    }
    .card-body a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
    }
    .card-body a:hover {
      text-decoration: underline;
    }
    .logout-btn {
      background: #fff;
      color: #ff5c93;
      border: 1px solid #ff5c93;
      border-radius: 30px;
      padding: 5px 15px;
    }
    .logout-btn:hover {
      background: #ff5c93;
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Teacher Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
          <li class="nav-item">
            <button class="logout-btn">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-5">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Manage Courses</h5>
            <p>Create, update, and manage course content.</p>
            <a href="#">Manage Courses</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Quizzes</h5>
            <p>Create and grade quizzes for students.</p>
            <a href="#">Manage Quizzes</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Attendance</h5>
            <p>Track and manage student attendance.</p>
            <a href="#">View Attendance</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
