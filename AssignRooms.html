<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Rooms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #eef2f7;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background-color: #28a745;
    }
    .navbar-brand, .nav-link {
      color: #fff !important;
    }
    .container {
      margin-top: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .btn-primary {
      background: #28a745;
      border: none;
    }
    .btn-primary:hover {
      background: #1f7a38;
    }
    .logout-btn {
      background: #fff;
      color: #28a745;
      border: 1px solid #28a745;
      border-radius: 30px;
      padding: 5px 15px;
    }
    .logout-btn:hover {
      background: #28a745;
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Admin Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
          <li class="nav-item">
            <button class="logout-btn">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <h3>Assign Rooms</h3>
    <form>
      <div class="mb-3">
        <label for="courseName" class="form-label">Course Name</label>
        <input type="text" class="form-control" id="courseName" required>
      </div>
      <div class="mb-3">
        <label for="roomNumber" class="form-label">Room Number</label>
        <input type="text" class="form-control" id="roomNumber" required>
      </div>
      <div class="mb-3">
        <label for="scheduleTime" class="form-label">Schedule Time</label>
        <input type="time" class="form-control" id="scheduleTime" required>
      </div>
      <button type="submit" class="btn btn-primary">Assign Room</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
