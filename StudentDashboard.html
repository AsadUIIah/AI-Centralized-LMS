<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background-color: #2575fc;
    }
    .navbar-brand, .nav-link {
      color: #fff !important;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card-header {
      background-color: #2575fc;
      color: #fff;
      font-weight: bold;
      text-align: center;
    }
    .card-body {
      text-align: center;
      padding: 20px;
    }
    .card-body a {
      text-decoration: none;
      color: #2575fc;
      font-weight: bold;
    }
    .card-body a:hover {
      text-decoration: underline;
    }
    .logout-btn {
      background: #fff;
      color: #2575fc;
      border: 1px solid #2575fc;
      border-radius: 30px;
      padding: 5px 15px;
    }
    .logout-btn:hover {
      background: #2575fc;
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="StudentDashboard.html">LMS|Student Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
          <li class="nav-item">
            <button class="logout-btn">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-5">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">Courses</div>
          <div class="card-body">
            <p>Access your enrolled courses.</p>
            <a href="Student Courses.html">View Courses</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">Assignments</div>
          <div class="card-body">
            <p>View and submit your assignments.</p>
            <a href="Student Assignments.html">View Assignments</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">Quizzes</div>
          <div class="card-body">
            <p>Participate in quizzes and track your progress.</p>
            <a href="Student Quizzes.html">View Quizzes</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
