<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assignments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background-color: #2575fc;
    }
    .navbar-brand, .nav-link {
      color: #fff !important;
    }
    .container {
      margin-top: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .assignment-item {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }
    .assignment-item:last-child {
      border-bottom: none;
    }
    .logout-btn {
      background: #fff;
      color: #2575fc;
      border: 1px solid #2575fc;
      border-radius: 30px;
      padding: 5px 15px;
    }
    .logout-btn:hover {
      background: #2575fc;
      color: #fff;
    }
  </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="StudentDashboard.html">LMS|Student Dashboard</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
              <li class="nav-item">
                <button class="logout-btn">Logout</button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
  <div class="container">
    <h3>Your Assignments</h3>
    <h5>Pending Assignments</h5>
    <div id="pending-assignments">
      <!-- Pending assignments will be dynamically injected here -->
    </div>
    <hr>
    <h5>Completed Assignments</h5>
    <div id="completed-assignments">
      <!-- Completed assignments will be dynamically injected here -->
    </div>
  </div>

  <script>
    // Simulated data from the database
    const assignments = {
      pending: [
        { id: 1, title: "Math Assignment 1", description: "Solve linear equations.", dueDate: "2024-12-20" },
        { id: 2, title: "Science Assignment 2", description: "Write a report on Newton's Laws.", dueDate: "2024-12-22" },
      ],
      completed: [
        { id: 3, title: "History Assignment 1", description: "Essay on the Industrial Revolution.", submittedOn: "2024-12-10" },
      ],
    };

    const pendingContainer = document.getElementById("pending-assignments");
    const completedContainer = document.getElementById("completed-assignments");

    // Render Pending Assignments
    assignments.pending.forEach(assignment => {
      const assignmentItem = document.createElement("div");
      assignmentItem.classList.add("assignment-item");
      assignmentItem.innerHTML = `
        <p><strong>${assignment.title}:</strong> ${assignment.description}</p>
        <p>Due Date: ${assignment.dueDate}</p>
        <a href="/submit/${assignment.id}" class="btn btn-success btn-sm">Submit Assignment</a>
      `;
      pendingContainer.appendChild(assignmentItem);
    });

    // Render Completed Assignments
    assignments.completed.forEach(assignment => {
      const assignmentItem = document.createElement("div");
      assignmentItem.classList.add("assignment-item");
      assignmentItem.innerHTML = `
        <p><strong>${assignment.title}:</strong> ${assignment.description}</p>
        <p>Submitted on: ${assignment.submittedOn}</p>
      `;
      completedContainer.appendChild(assignmentItem);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
